## Settings file was created by plugin VikingTruss v1.0.0
## Plugin GUID: com.kinematiclogic.vikingtruss

[0. General]

## Master switch to enable or disable all VikingTruss physics modifications (set to false for vanilla multiplayer).
# Setting type: Boolean
# Default value: true
EnableMod = true

[1. Trusses & Struts]

## Horizontal loss multiplier for angled beams (20 to 65 degrees). Lower = stronger angled struts.
# Setting type: Single
# Default value: 0.45
StrutLossMultiplier = 0.45

## Support loss multiplier when connected pieces form a closed structural triangle (3-piece or 4-piece with 2-beam chord).
# Setting type: Single
# Default value: 0.5
TrussTriangleMultiplier = 0.5

[2. Live Loads]

## If enabled, heavy entities (Trolls, Lox, loaded carts, over-encumbered players) apply dynamic support penalties to spans.
# Setting type: Boolean
# Default value: true
EnableLiveLoads = true

## Minimum cumulative live load mass (kg) required before live load begins penalizing a structure (Player base mass is 100kg).
# Setting type: Single
# Default value: 350
LiveLoadMassThreshold = 350

## Support penalty per kg of excess live load mass: EffectiveSupport = BaseSupport - ((LiveLoadMass - Threshold) * LiveLoadSensitivity).
# Setting type: Single
# Default value: 0.04
LiveLoadSensitivity = 0.04

## Interval in seconds between live-load overlap evaluations on non-grounded structural pieces.
# Setting type: Single
# Default value: 0.25
LiveLoadCheckInterval = 0.25

## Multiplier applied to non-player creature live-load mass (Trolls, Lox, Golems, etc.).
# Setting type: Single
# Default value: 1
CreatureMassMultiplier = 1

## If enabled, player-influenced overloads (Players, Carts, Tamed creatures) apply support-scaled structural damage (30% to 100% HP based on overload severity) rather than immediately destroying healthy pieces.
# Setting type: Boolean
# Default value: true
PlayerLoadDamagesBeforeDestroy = true

## If enabled, friendly/player-influenced overloads can only destroy a piece if it was already in the damaged visual state (<26% HP) prior to the load being added. Even severe overloads on healthy or worn pieces will clamp at the damaged state (20% HP) for that crossing.
# Setting type: Boolean
# Default value: true
NeverDestroyOnFirstFriendlyCrossing = true

## If enabled, untamed hostile creatures (Trolls, Stone Golems, etc.) bypass the fracture stage and immediately destroy overloaded spans.
# Setting type: Boolean
# Default value: true
HostileLoadDestroysImmediately = true

## Grace period in seconds after a friendly overload damages a piece before subsequent crossing loads can damage or destroy it.
# Setting type: Single
# Default value: 25
PostFractureGraceSeconds = 25

[3. Stress Feedback (Audio & Visual)]

## If enabled, structural pieces creak when nearing capacity and snap/crack when critically stressed.
# Setting type: Boolean
# Default value: true
EnableStressSounds = true

## If enabled, pieces under active live load automatically glow orange (>=75% capacity) or red (>=90% capacity) even without the Hammer equipped.
# Setting type: Boolean
# Default value: true
EnableStressVisualHighlight = true

## Visual intensity (0.05 to 1.0) of the automatic live-load stress highlight (0.45 = ~45% of vanilla Hammer highlight glow).
# Setting type: Single
# Default value: 0.45
StressHighlightIntensity = 0.45

## Capacity utilization fraction (0.0 to 1.0) at which pieces begin to creak/groan and show stress highlight under live load.
# Setting type: Single
# Default value: 0.75
CreakCapacityThreshold = 0.75

## Capacity utilization fraction (0.0 to 1.0) at which pieces emit sharp cracking/snapping sounds, red highlight, and splinter particles.
# Setting type: Single
# Default value: 0.9
SnapCapacityThreshold = 0.9

## Master volume multiplier (0.05 to 2.0) for structural creak and snap/crack sound effects.
# Setting type: Single
# Default value: 0.85
StressSoundVolume = 0.85
